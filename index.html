<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escáner Universal (iPhone / Android)</title>
  <!-- Cargamos la librería ZXing para compatibilidad universal -->
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f4f9; }
    .container { max-width: 400px; margin: 0 auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    video { width: 100%; border-radius: 8px; background: #000; }
    #resultado { margin-top: 15px; font-size: 1.2em; font-weight: bold; color: #2c3e50; word-break: break-all; }
    .estado { font-size: 0.9em; color: #666; margin-bottom: 10px; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Probador de Escáner (iOS / Android)</h2>
    <p class="estado" id="estado">Iniciando cámara...</p>
    <video id="video" autoplay playsinline muted></video>
    <div id="resultado">Esperando código...</div>
  </div>

  <script>
    const video = document.getElementById('video');
    const resultado = document.getElementById('resultado');
    const estado = document.getElementById('estado');

    async function iniciarEscaner() {
      // Usamos el lector ZXing compatible con iOS y Android
      const codeReader = new ZXing.BrowserMultiFormatReader();

      try {
        // Pedir las cámaras disponibles en el iPhone
        const videoInputDevices = await codeReader.listVideoInputDevices();
        
        // Seleccionar la cámara trasera (environment)
        let selectedDeviceId;
        const trasera = videoInputDevices.find(device => 
          device.label.toLowerCase().includes('back') || 
          device.label.toLowerCase().includes('trasera') || 
          device.label.toLowerCase().includes('environment')
        );

        selectedDeviceId = trasera ? trasera.deviceId : videoInputDevices[0].deviceId;

        estado.textContent = "📷 Apuntá al código de barras";

        // Iniciar escaneo continuo
        codeReader.decodeFromVideoDevice(selectedDeviceId, 'video', (result, err) => {
          if (result) {
            resultado.textContent = "🎉 ¡Código leído!: " + result.getText();
            resultado.style.color = "green";
          }
        });

      } catch (error) {
        estado.textContent = "❌ Error al acceder a la cámara: " + error.message;
      }
    }

    iniciarEscaner();
  </script>
</body>
</html>
