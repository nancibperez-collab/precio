<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de Precios</title>
  <!-- Librería Html5-QRCode -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 15px; background-color: #f4f4f9; margin: 0; }
    h1 { color: #333; margin-top: 10px; font-size: 24px; }
    .instrucciones { color: #666; font-size: 14px; margin-bottom: 15px; }
    .btn-escanear { background-color: #007bff; color: white; border: none; padding: 14px 24px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; max-width: 320px; }
    .btn-escanear:active { background-color: #0056b3; }
    .viewport { width: 100%; max-width: 360px; margin: 15px auto; border: 2px dashed #007bff; border-radius: 12px; background: #000; min-height: 220px; overflow: hidden; }
    .resultado { background: white; padding: 20px; border-radius: 12px; max-width: 360px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .label-codigo { font-size: 13px; color: #777; margin-bottom: 5px; }
    .precio { font-size: 32px; font-weight: bold; color: #28a745; margin-top: 10px; }
  </style>
</head>
<body>

  <h1>Consulta de Precios</h1>
  <p class="instrucciones">Presiona el botón y enfoca el código de barras.</p>
  
  <button class="btn-escanear" id="btnIniciar" onclick="iniciarEscaner()">📷 Escanear Producto</button>

  <div id="interactive" class="viewport"></div>

  <div class="resultado" id="contenedorResultado">
    <div class="label-codigo">Código detectado: <strong id="codigoLeido">-</strong></div>
    <h2 id="nombreProducto" style="font-size: 20px; margin: 10px 0;">Esperando escaneo...</h2>
    <div class="precio" id="precioProducto">-</div>
  </div>

  <script>
    let listaProductos = [];
    let html5QrCode = null;

    // Cargar productos desde el JSON
    fetch('productos.json')
      .then(response => response.json())
      .then(data => {
        listaProductos = data;
        console.log('Productos cargados:', listaProductos.length);
      })
      .catch(err => {
        console.error('Error al cargar productos.json:', err);
        document.getElementById('nombreProducto').textContent = 'Error al cargar base de datos';
      });

    function iniciarEscaner() {
      document.getElementById('nombreProducto').textContent = 'Buscando código...';
      document.getElementById('precioProducto').textContent = '-';

      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => activarCamara()).catch(err => console.error(err));
      } else {
        activarCamara();
      }
    }

    function activarCamara() {
      html5QrCode = new Html5Qrcode("interactive", {
        formatsToSupport: [
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.CODE_128
        ]
      });

      const configuracion = { 
        fps: 20, 
        qrbox: { width: 280, height: 120 },
        aspectRatio: 1.0
      };

      // Inicio estándar sin restricciones complejas
      html5QrCode.start(
        { facingMode: "environment" }, 
        configuracion, 
        onScanSuccess
      ).catch(err => {
        alert("No se pudo acceder a la cámara. Por favor, cierra la pestaña y vuelve a abrirla aceptando los permisos.");
      });
    }

    function onScanSuccess(decodedText) {
      html5QrCode.stop().then(() => {
        buscarProducto(decodedText);
      }).catch(err => console.error(err));
    }

    function buscarProducto(codigoEscaneado) {
      const codigoLimpio = String(codigoEscaneado).trim();
      document.getElementById('codigoLeido').textContent = codigoLimpio;

      const encontrado = listaProductos.find(item => {
        const codigoEnJson = String(
          item["Código de barras"] || 
          item["codigo_barras"] || 
          item["Codigo de barras"] || ''
        ).trim();

        return codigoEnJson === codigoLimpio;
      });

      if (encontrado) {
        document.getElementById('nombreProducto').textContent = encontrado["Producto"] || encontrado["producto"];
        document.getElementById('precioProducto').textContent = `$${encontrado["Precio"] || encontrado["precio"]}`;
      } else {
        document.getElementById('nombreProducto').textContent = 'Artículo no encontrado';
        document.getElementById('precioProducto').textContent = '-';
      }
    }
  </script>
</body>
</html>
