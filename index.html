<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Precios</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #cccccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            text-align: center;
        }
        .card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            background-color: #fafafa;
        }
        .nombre-producto {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        .precio-producto {
            font-size: 28px;
            color: #2e7d32;
            font-weight: bold;
        }
        .error {
            color: #d32f2f;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Buscador de Precios</h2>
    <input type="text" id="codigoInput" placeholder="Escanee o ingrese el código..." autofocus autocomplete="off">

    <div class="card" id="resultadoCard">
        <div class="nombre-producto" id="nombreProducto">Cargando base de datos...</div>
        <div class="precio-producto" id="precioProducto">$ -</div>
    </div>
</div>

<script>
    let productos = [];
    const input = document.getElementById('codigoInput');
    const nombreEl = document.getElementById('nombreProducto');
    const precioEl = document.getElementById('precioProducto');

    // Carga directa del archivo JSON subido a GitHub
    fetch('productos.json')
        .then(response => {
            if (!response.ok) throw new Error('No se pudo cargar el archivo JSON');
            return response.json();
        })
        .then(data => {
            productos = data;
            nombreEl.textContent = "Listo para escanear";
        })
        .catch(error => {
            console.error('Error:', error);
            nombreEl.textContent = "Error al cargar productos.json";
            nombreEl.classList.add('error');
        });

    // Mantener foco automático en el cuadro de texto para la lectora
    document.addEventListener('click', () => input.focus());

    input.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            const codigo = input.value.trim();
            if (codigo) {
                buscarProducto(codigo);
            }
            input.value = '';
        }
    });

    function buscarProducto(codigo) {
        if (productos.length === 0) {
            nombreEl.textContent = "Base de datos no cargada";
            return;
        }

        // Búsqueda exacta comparando con las claves del JSON ("Código de barras" y "Precio")
        const productoEncontrado = productos.find(p => {
            if (!p["Código de barras"]) return false;
            return String(p["Código de barras"]).trim() === codigo;
        });

        if (productoEncontrado) {
            nombreEl.textContent = productoEncontrado["Producto"];
            precioEl.textContent = `$${productoEncontrado["Precio"]}`;
            nombreEl.classList.remove('error');
        } else {
            nombreEl.textContent = "Producto no encontrado";
            precioEl.textContent = "$ -";
            nombreEl.classList.add('error');
        }
    }
</script>

</body>
</html>
